name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "assets/**"
      - "app.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build standalone installable APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Android platform tools
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --no-install
        env:
          CI: "1"

      - name: Build standalone release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android

      - name: Verify APK is self-contained and ARM64-only
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -tq "$APK"
          unzip -Z1 "$APK" | grep -Fxq 'assets/index.android.bundle'
          ABIS=$(unzip -Z1 "$APK" | awk -F/ '$1=="lib" && NF>=3 {print $2}' | sort -u)
          test "$ABIS" = "arm64-v8a"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vids-buka-hp-arm64-standalone-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
